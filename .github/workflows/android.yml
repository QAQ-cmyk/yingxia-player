name: Android & Ktor Server
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Configure Google Maven Central mirror for CI
        run: |
          cat <<'EOF' > /tmp/ci-mirror.init.gradle
          gradle.settingsEvaluated { settings ->
              def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2/"
              [settings.pluginManagement.repositories, settings.dependencyResolutionManagement.repositories].each { repos ->
                  def mirror = repos.maven {
                      name = "GoogleMavenCentralMirror"
                      url = mirrorUrl
                  }
                  repos.remove(mirror)
                  def central = repos.find { it.name == "MavenRepo" }
                  def idx = central != null ? repos.indexOf(central) : 0
                  repos.add(idx, mirror)
              }
          }
          EOF
      - name: Build, lint and run unit & server tests
        run: ./gradlew --init-script /tmp/ci-mirror.init.gradle :shared-protocol:test :server:test :app:testOfflineDebugUnitTest :app:testSyncDebugUnitTest :app:lintOfflineDebug :app:assembleOfflineRelease :app:assembleSyncRelease --stacktrace
      - name: Check packaged offline APK privacy & DEX isolation
        run: python3 scripts/check-apk-privacy.py app/build/outputs/apk/offline/release/app-offline-release-unsigned.apk
