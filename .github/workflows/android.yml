name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build, lint and run unit tests
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Check packaged privacy settings
        run: python3 scripts/check-apk-privacy.py app/build/outputs/apk/release/app-release-unsigned.apk
